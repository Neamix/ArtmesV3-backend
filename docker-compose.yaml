name: "artmes"
services:
  backend: 
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    env_file:
      - ./.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./:/app
      - backend-module:/app/node_modules

  redis:
    image: redis:8-alpine
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - 5540:5540
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - redisinsight-data:/data

volumes:
  backend-module:
  redis-data:
  redisinsight-data:
